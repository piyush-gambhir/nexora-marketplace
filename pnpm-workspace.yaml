allowBuilds:
  sharp: true
  unrs-resolver: true

# Security floors for vulnerable transitive dependencies, each scoped to the
# vulnerable range of one major line. Drop an entry once its parents ship a
# patched version on their own.
overrides:
  '@babel/core@>=7.0.0 <7.29.6': '7.29.6'
  'baseline-browser-mapping@>=2.0.0 <2.11.0': '2.11.0'
  'brace-expansion@>=1.0.0 <1.1.21': '1.1.21'
  'brace-expansion@>=5.0.0 <5.0.12': '5.0.12'
  'browserslist@>=4.0.0 <4.28.7': '4.28.7'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  'picomatch@>=2.0.0 <2.3.2': '2.3.2'
  'picomatch@>=4.0.0 <4.0.4': '4.0.4'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  'ws@>=7.0.0 <7.5.11': '7.5.11'
  'yaml@>=2.0.0 <2.8.3': '2.8.3'
